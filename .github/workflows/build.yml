name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned Release (iphoneos)
        run: |
          xcodebuild \
            -project GolfSim.xcodeproj \
            -scheme GolfSim \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Payload into unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GolfSim.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find build -name "GolfSim.app" -type d
            exit 1
          fi
          rm -rf Payload GolfSim.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/GolfSim.app
          zip -r GolfSim.ipa Payload
          ls -lh GolfSim.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GolfSim-unsigned-ipa
          path: GolfSim.ipa
          if-no-files-found: error
